spring:
  config:
    import: optional:file:./application-secret.yml
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:h2:mem:coffeeshop;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  uploads:
    dir: /tmp/coffee-shop-uploads
    base-url: http://localhost:8080/uploads

logging:
  level:
    com.coffeeshop: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
