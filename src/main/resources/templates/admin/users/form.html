<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Создать пользователя — Admin')}"></head>
<body>
<div th:replace="~{admin/layout :: sidebar('users')}"></div>
<div class="main">
    <div class="page-header" style="display:flex;align-items:center;gap:12px;">
        <a th:href="@{/admin/users}" class="btn btn-secondary btn-sm">← Назад</a>
        <h1>Создать пользователя</h1>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card" style="max-width:480px;">
        <form th:action="@{/admin/users/new}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Имя *</label>
                <input type="text" name="name" required placeholder="Иван Иванов"
                       style="width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px;"/>
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Телефон * (E.164)</label>
                <input type="tel" name="phone" required placeholder="+79161234567"
                       pattern="^\+[1-9]\d{6,14}$"
                       style="width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px;font-family:monospace;"/>
                <p style="font-size:12px;color:#6b7280;margin-top:4px;">Формат: +79161234567</p>
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Email (необязательно)</label>
                <input type="email" name="email" placeholder="ivan@example.com"
                       style="width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px;"/>
            </div>

            <div style="margin-bottom:24px;">
                <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Бонусные баллы</label>
                <input type="number" name="bonusPoints" value="0" min="0"
                       style="width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px;"/>
            </div>

            <button type="submit" class="btn btn-primary">Создать пользователя</button>
        </form>
    </div>
</div>
</body>
</html>
