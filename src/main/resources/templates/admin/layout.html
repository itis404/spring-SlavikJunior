<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${pageTitle ?: 'Admin — Coffee Shop'}">Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f0; color: #1a1a1a; }
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
            background: #1a1a1a; color: #fff; padding: 24px 0;
            display: flex; flex-direction: column;
        }
        .sidebar-logo {
            font-size: 18px; font-weight: 700; padding: 0 24px 24px;
            border-bottom: 1px solid #333; letter-spacing: 0.5px;
        }
        .sidebar nav { padding: 16px 0; flex: 1; }
        .sidebar nav a {
            display: block; padding: 10px 24px; color: #ccc; text-decoration: none;
            font-size: 14px; transition: all 0.15s;
        }
        .sidebar nav a:hover, .sidebar nav a.active { color: #fff; background: #2a2a2a; }
        .sidebar-footer { padding: 16px 24px; border-top: 1px solid #333; }
        .sidebar-footer a { color: #888; font-size: 13px; text-decoration: none; }
        .main { margin-left: 220px; padding: 32px; min-height: 100vh; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 24px; font-weight: 600; }
        .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px;
               font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; transition: opacity .15s; }
        .btn:hover { opacity: .85; }
        .btn-primary { background: #1a1a1a; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { font-weight: 600; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-yellow { background: #fef3c7; color: #92400e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        form.inline { display: inline; }
    </style>
    <th:block th:fragment="extraStyles"></th:block>
</head>
<body>
<div class="sidebar" th:fragment="sidebar(activePage)">
    <div class="sidebar-logo">☕ Coffee Shop</div>
    <nav>
        <a th:href="@{/admin/orders}" th:classappend="${activePage == 'orders'} ? 'active'">Заказы</a>
        <a th:href="@{/admin/menu}" th:classappend="${activePage == 'menu'} ? 'active'">Меню</a>
        <a th:href="@{/admin/analytics}" th:classappend="${activePage == 'analytics'} ? 'active'">Аналитика</a>
        <a th:href="@{/admin/feedback}" th:classappend="${activePage == 'feedback'} ? 'active'">Отзывы</a>
        <a th:href="@{/admin/users}" th:classappend="${activePage == 'users'} ? 'active'">Пользователи</a>
        <a th:href="@{/admin/notifications}" th:classappend="${activePage == 'notifications'} ? 'active'">Уведомления</a>
    </nav>
    <div class="sidebar-footer">
        <form th:action="@{/admin/logout}" method="post" class="inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" style="background:none;border:none;cursor:pointer;color:#888;font-size:13px;padding:0;">Выйти</button>
        </form>
    </div>
</div>
<div class="main" th:fragment="content">
</div>
</body>
</html>
