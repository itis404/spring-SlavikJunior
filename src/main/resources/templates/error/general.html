<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ошибка</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f0; }
        .box { background: #fff; padding: 40px; border-radius: 12px; text-align: center; max-width: 420px; }
        h1 { font-size: 48px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
        p { color: #6b7280; margin-bottom: 24px; }
        a { color: #1a1a1a; font-weight: 600; }
    </style>
</head>
<body>
<div class="box">
    <h1 th:text="${status ?: 500}"></h1>
    <p th:text="${error ?: 'Что-то пошло не так'}"></p>
    <a href="/admin/orders">← На главную</a>
</div>
</body>
</html>
