spring:
  application:
    name: coffee-shop
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: dev
  jpa:
    open-in-view: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  currency: RUB
  currency-symbol: "₽"
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-please-change-in-production-at-least-256-bits}
    access-token-expiration: 900000       # 15 minutes in ms
    refresh-token-expiration: 2592000000  # 30 days in ms
  tbank:
    terminal-key: ${TBANK_TERMINAL_KEY:}
    secret-key: ${TBANK_SECRET_KEY:}
    api-url: ${TBANK_API_URL:https://securepay.tinkoff.ru/v2}
  fastapi:
    url: ${FASTAPI_URL:http://localhost:8001}
    timeout-ms: 3000
  uploads:
    dir: ${UPLOADS_DIR:/app/uploads}
    base-url: ${UPLOADS_BASE_URL:/uploads}
    max-file-size-bytes: 5242880  # 5 MB
  firebase:
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  cleanup:
    chat-retention-days: 45

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: swagger-ui.html
    operations-sorter: method
