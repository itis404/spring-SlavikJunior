events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 10m;

    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=otp_verify_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;

        limit_conn addr 50;

        # Serve uploaded files directly from shared volume.
        # Security headers are set here because nginx serves these files directly (no Spring Boot),
        # so Spring Security does not add headers for this path.
        # For all proxied locations (/api/**, /admin/**, /), Spring Security 6 already provides
        # the correct security headers — no duplication needed here.
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "0" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Disposition "attachment";
        }

        # Strict rate limit for Firebase OTP verify and register endpoints
        location ~ ^/api/auth/firebase/(verify|register)$ {
            limit_req zone=otp_verify_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Upload endpoints — longer timeouts for large file transfers (up to 5 MB)
        location ~ ^/api/upload/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            client_body_timeout 120s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
