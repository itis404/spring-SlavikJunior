version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: coffee-shop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    container_name: coffee-shop-app
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/coffeeshop
      DB_USERNAME: coffeeshop
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      JWT_SECRET: ${JWT_SECRET}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_SECRET_KEY: ${TBANK_SECRET_KEY:-}
      FASTAPI_URL: http://fastapi:8001
      UPLOADS_DIR: /app/uploads
      UPLOADS_BASE_URL: /uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: coffee-shop-db
    environment:
      POSTGRES_DB: coffeeshop
      POSTGRES_USER: coffeeshop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: coffee-shop-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password}
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
